# Lightweight local MySQL for developers who aren't running Herd's own
# database service — matches .env.example's default DB_* values.
# Usage: docker compose -f docker-compose.local.yml up -d
services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: "nativephp.com"
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mysql-data:
